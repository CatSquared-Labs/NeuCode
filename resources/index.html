<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>neucode</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Toolbar -->
    <div id="toolbar">
        <div class="menu-item">
            <button class="tool-btn" id="file-btn" onclick="toggleMenu('file-menu')">File</button>
            <button class="tool-btn" id="edit-btn" onclick="toggleMenu('edit-menu')">Edit</button>
            <button class="tool-btn" id="git-btn" onclick="toggleMenu('git-menu')">Git</button>
            <div id="file-menu" class="dropdown-content">
                <button onclick="openFile()">Open File</button>
                <button onclick="openFolder()">Open Folder</button>
                <div class="menu-sep"></div>
                <button onclick="saveFile()">Save</button>
                <button onclick="Neutralino.app.exit()">Exit</button>
            </div>
            <div id="edit-menu" class="dropdown-content">
                <button onclick="undoEdit()">Undo</button>
                <button onclick="redoEdit()">Redo</button>
                <div class="menu-sep"></div>
                <button onclick="cutText()">Cut</button>
                <button onclick="copyText()">Copy</button>
                <button onclick="pasteText()">Paste</button>
                <div class="menu-sep"></div>
                <button onclick="openFindInMenu()">Find (Ctrl+F)</button>
            </div>
            <div id="find-input-container" class="find-input-container" style="display:none;">
                <input type="text" id="find-text-input" placeholder="Find text..." />
                <button onclick="findNext()">Next</button>
                <button onclick="findPrev()">Prev</button>
                <button onclick="closeFindInput()">Close</button>
            </div>
            <div id="git-menu" class="dropdown-content">
                <button onclick="gitInit()">Initialize Repository</button>
                <button onclick="gitAdd()">Add Files</button>
                <button onclick="gitCommit()">Commit Changes</button>
                <button onclick="gitPush()">Push Changes</button>
            </div>
        </div>
        <div style="flex:1"></div>
        <span id="title-bar-text">NeuCode v1.1.0</span>
        <span id="title-bar-seperator"> | </span>
        <div id="tab-bar"><span id="active-tab-name">new file</span></div>
    </div>
        <div id="main-area">
            <!-- Sidebar Explorer -->
            <div id="sidebar">
                <div id="sidebar-header">
                    <span>Explorer</span>
                    <button class="sidebar-btn" id="new-file-btn" title="New File">📄</button>
                    <button class="sidebar-btn" id="new-folder-btn" title="New Folder">📁</button>
                </div>
                <div id="folder-path">No folder opened</div>
                <div id="file-tree"></div>
            </div>

            <div id="editor-shell">
                <div id="line-numbers"></div>
                <!-- NEW: Container for the stacking layers -->
                <div id="editor-container">
                    <div id="highlight-layer"></div>
                    <textarea id="main-editor" spellcheck="false" placeholder="Start coding..."></textarea>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar">
            <span id="file-path"></span>
        </div>
    </div>

    <script src="js/neutralino.js"></script>
    <script src="js/highlight.js"></script>
    <script src="js/toolbar/file.js"></script>
    <script src="js/toolbar/git.js"></script>
    <script src="js/toolbar/edit.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>
    <script src="js/file_explorer.js"></script>
</body>
</html>
