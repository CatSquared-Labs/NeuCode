<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>neucode</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Toolbar -->
        <div id="toolbar">
            <button class="tool-btn" onclick="openFile()">Open File</button>
            <button class="tool-btn" onclick="saveFile()">Save</button>
            <button class="tool-btn" onclick="openFolder()">Open Folder</button>
            <div style="flex:1"></div>
            <span id="title-bar-text">NeuCode v0.3.0|</span>
            <div id="tab-bar"><span id="active-tab-name">new file</span></div>
        </div>

        <div id="main-area">
            <!-- Sidebar Explorer -->
            <div id="sidebar">
                <div id="sidebar-header">
                    <span>Explorer</span>
                </div>
                <div id="folder-path">No folder opened</div>
                <div id="file-tree"></div>
            </div>

            <div id="editor-shell">
                <div id="line-numbers"></div>
                <!-- NEW: Container for the stacking layers -->
                <div id="editor-container">
                    <div id="highlight-layer"></div>
                    <textarea id="main-editor" spellcheck="false" placeholder="Start coding..."></textarea>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar">
            <span id="file-path"></span>
        </div>
    </div>

    <script src="js/neutralino.js"></script>
    <script src="js/highlight.js"></script>
    <script src="js/toolbar/file.js"></script>
    <script src="js/main.js"></script>
    <script src="js/file_explorer.js"></script>
</body>
</html>
